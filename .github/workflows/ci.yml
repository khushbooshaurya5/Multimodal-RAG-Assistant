name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Offline profile: no model downloads in CI. Neural-model tests skip themselves.
      MRAG_EMBEDDING_BACKEND: hashing
      MRAG_WHISPER_BACKEND: none
      MRAG_VISION_BACKEND: metadata
      MRAG_LLM_BACKEND: extractive
      MRAG_DEVICE: cpu
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU torch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src app tests scripts && ruff format --check src app tests scripts
      - name: Tests
        run: pytest -q -m "not requires_models" --cov=src --cov-report=term-missing
      - name: Offline evaluation smoke run
        run: python scripts/evaluate.py --tag ci --out-dir reports/scratch
